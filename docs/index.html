6> <svg class="donut-svg" viewBox="0 0 88 88" aria-hidden="true" data-astro-cid-j7pv25f6> <circle class="donut-bg" cx="44" cy="44" r="38" data-astro-cid-j7pv25f6></circle> <circle id="donutFill" class="donut-fill" cx="44" cy="44" r="38" data-astro-cid-j7pv25f6></circle> </svg> <div class="donut-center" data-astro-cid-j7pv25f6> <span class="donut-pct" data-astro-cid-j7pv25f6>100%</span> <span class="donut-lbl" data-i18n="ratio" data-astro-cid-j7pv25f6>ratio</span> </div> </div> <div class="bars-section" data-astro-cid-j7pv25f6> <div class="bar-row" data-astro-cid-j7pv25f6> <div class="bar-meta" data-astro-cid-j7pv25f6> <span data-i18n="before" data-astro-cid-j7pv25f6>Before</span> <strong id="barBeforeLabel" data-astro-cid-j7pv25f6>—</strong> </div> <div class="bar-track" data-astro-cid-j7pv25f6><div class="bar-fill" id="barBefore" data-astro-cid-j7pv25f6></div></div> </div> <div class="bar-row" data-astro-cid-j7pv25f6> <div class="bar-meta" data-astro-cid-j7pv25f6> <span data-i18n="after" data-astro-cid-j7pv25f6>After</span> <strong id="barAfterLabel" data-astro-cid-j7pv25f6>0 B</strong> </div> <div class="bar-track" data-astro-cid-j7pv25f6><div class="bar-fill" id="barAfter" data-astro-cid-j7pv25f6></div></div> </div> </div> </div> <p class="done-msg" id="message" data-astro-cid-j7pv25f6> <span class="ms" aria-hidden="true" data-astro-cid-j7pv25f6>check_circle</span><span data-i18n="compressed" data-astro-cid-j7pv25f6>Compressed 100%!</span> </p> <a id="downloadBtn" class="download-btn" download data-astro-cid-j7pv25f6> <span class="ms" style="font-size:17px;vertical-align:-4px;margin-right:2px" aria-hidden="true" data-astro-cid-j7pv25f6>download</span> <span data-i18n="download" data-astro-cid-j7pv25f6>Download compressed file</span> </a> </div> </div><!-- #result --> </div><!-- .card --> <script>
    (function () {
      var t      = window.__t;
      var locale = window.__locale;

      /* ── fmt bytes ── */
      function fmt(n) {
        if (n < 1024)    return n + ' B';
        if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1048576).toFixed(2) + ' MB';
      }

      /* ── apply translations ── */
      function applyT() {
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var k = el.getAttribute('data-i18n');
          if (t[k] !== undefined) el.textContent = t[k];
        });
        document.title = t.title;
        document.querySelectorAll('.lang-btn').forEach(function (btn) {
          var active = btn.getAttribute('data-lang') === locale;
          btn.setAttribute('aria-pressed', String(active));
          btn.classList.toggle('active', active);
        });
      }

      /* ── lang switch ── */
      document.querySelectorAll('.lang-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var l = btn.getAttribute('data-lang');
          try { localStorage.setItem('act-lang', l); } catch (e) {}
          window.__locale = l;
          window.__t = l === 'ja' ? window.__ja : window.__en;
          t = window.__t;
          locale = l;
          document.documentElement.lang = l;
          document.documentElement.setAttribute('data-locale', l);
          applyT();
          if (_currentFile) updateSizeLabels(_currentFile.size);
        });
      });

      applyT();

      var _currentFile = null;

      /*
        showPhase — zero-flash phase switching
        Pattern:
          1. Hide all phases (display:none).
          2. Reset animated values while hidden
             (browser ignores transitions on hidden els → instant reset).
          3. Show target (display:flex via .vis class).
          4. Caller calls forceReflow() immediately after to commit
             the reset values as the painted "from" state.
          5. Caller then sets transition + new values → animates.
        This way the element NEVER appears in an intermediate state.
      */
      function showPhase(id) {
        /* hide all */
        ['phaseAnalyzing', 'phaseCompressing', 'phaseDone'].forEach(function (pid) {
          var el = document.getElementById(pid);
          el.classList.remove('vis');
        });

        /* reset animated values while hidden */
        if (id === 'phaseDone') {
          var df = document.getElementById('donutFill');
          if (df) { df.style.transition = 'none'; df.style.strokeDashoffset = '239'; }
          var bb = document.getElementById('barBefore');
          if (bb) { bb.style.transition = 'none'; bb.style.width = '0'; }
          var ab = document.getElementById('barAfter');
          if (ab) { ab.style.transition = 'none'; ab.style.width = '0'; }
        }
        if (id === 'phaseCompressing') {
          var pb = document.getElementById('progressBar');
          if (pb) { pb.style.transition = 'none'; pb.style.width = '0'; }
        }

        /* show — reset values are committed as "from" state on next reflow */
        document.getElementById(id).classList.add('vis');
      }

      /* force browser to flush pending style changes and commit layout */
      function forceReflow(el) {
        void (el || document.body).getBoundingClientRect();
      }

      /* ── update size labels ── */
      function updateSizeLabels(bytes) {
        var sbl = document.getElementById('sizeBeforeLabel');
        if (sbl) sbl.textContent = fmt(bytes);
        var bbl = document.getElementById('barBeforeLabel');
        if (bbl) bbl.textContent = fmt(bytes);
        var sv  = document.getElementById('savingsVal');
        if (sv)  sv.textContent = fmt(bytes);
      }



      /* ── main file handler ── */
      function handleFile(file) {
        _currentFile = file;

        var errorMsg = document.getElementById('errorMsg');
        errorMsg.style.display = 'none';

        if (!file.type.startsWith('image/')) {
          document.getElementById('errorText').textContent = t.notSupported;
          errorMsg.style.display = 'block';
          document.getElementById('result').style.display = 'none';
          return;
        }

        /* preview */
        var preview = document.getElementById('filePreview');
        document.getElementById('previewName').textContent = file.name;
        document.getElementById('previewType').textContent = file.type + ' · ' + fmt(file.size);
        document.getElementById('previewImg').src = URL.createObjectURL(file);
        preview.style.display = 'flex';

        /* show result container */
        document.getElementById('result').style.display = 'block';

        /* — Phase 1: Analyzing — */
        showPhase('phaseAnalyzing');

        /* — Phase 2: Compressing — */
        setTimeout(function () {
          showPhase('phaseCompressing');
          var pctEl = document.getElementById('progressPct');
          var pb    = document.getElementById('progressBar');
          pctEl.textContent = '0%';
          /* commit reset state, then start transition */
          forceReflow(pb);
          pb.style.transition = 'width 0.85s cubic-bezier(0.4,0,0.2,1)';
          pb.style.width = '100%';
          setTimeout(function () { pctEl.textContent = '100%'; }, 850);

          /* — Phase 3: Done — */
          setTimeout(function () {
            /* pre-fill size labels before phase is visible */
            updateSizeLabels(file.size);

            showPhase('phaseDone');
            applyT(); /* re-apply translations (data-i18n inside phaseDone) */

            /* commit reset state, then start chart transitions in one shot */
            var df2 = document.getElementById('donutFill');
            var bb2 = document.getElementById('barBefore');
            forceReflow(document.getElementById('phaseDone'));
            if (df2) {
              df2.style.transition = 'stroke-dashoffset 0.85s cubic-bezier(0.4,0,0.2,1)';
              df2.style.strokeDashoffset = '0';
            }
            if (bb2) {
              bb2.style.transition = 'width 0.85s cubic-bezier(0.4,0,0.2,1)';
              bb2.style.width = '100%';
            }

            /* 0-byte blob download */
            var blob = new Blob([], { type: file.type });
            var dl   = document.getElementById('downloadBtn');
            var rand6 = Math.random().toString(36).slice(2, 8);
            dl.href     = URL.createObjectURL(blob);
            dl.download = 'amazing-' + rand6 + '_' + file.name;

          }, 950);
        }, 480);
      }

      /* ── event listeners ── */
      document.getElementById('fileInput').addEventListener('change', function () {
        if (this.files && this.files.length) handleFile(this.files[0]);
        this.value = '';
      });

      var dz = document.getElementById('dropzone');
      dz.addEventListener('dragover',  function (e) { e.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', function (e) { if (!dz.contains(e.relatedTarget)) dz.classList.remove('over'); });
      dz.addEventListener('drop', function (e) {
        e.preventDefault();
        dz.classList.remove('over');
        var files = e.dataTransfer && e.dataTransfer.files;
        if (files && files.length) handleFile(files[0]);
      });

    })();
    </script> </body> </html>
